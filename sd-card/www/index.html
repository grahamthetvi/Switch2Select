<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Switch2Select</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="target"></div>
    <div id="visual"></div>
  </div>
  <a id="setup" href="edit.html">Setup</a>
  <div id="demo" hidden>
    <button type="button" data-index="0">1</button>
    <button type="button" data-index="1">2</button>
    <button type="button" data-index="2">3</button>
    <button type="button" data-index="3">4</button>
    <button type="button" data-action="advance">Scan</button>
    <button type="button" data-action="select">Select</button>
    <button type="button" data-action="volup">Vol+</button>
    <button type="button" data-action="voldown">Vol-</button>
    <button type="button" data-action="device">Device</button>
  </div>
  <script src="switch2select.js"></script>
  <script src="app.js"></script>
</body>
</html>
